name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MAPPA_GPG_PRIVATE_KEY: ${{ secrets.MAPPA_GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri and WebKitGTK dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo systemctl stop unattended-upgrades apt-daily.service apt-daily-upgrade.service || true
          sudo apt-get -o DPkg::Lock::Timeout=180 -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 update
          sudo apt-get install -y --no-install-recommends \
            -o DPkg::Lock::Timeout=300 \
            -o Dpkg::Options::=--force-confdef \
            -o Dpkg::Options::=--force-confold \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libsoup-3.0-dev libssl-dev libxdo-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Build packages
        run: ./ui/node_modules/.bin/tauri build --bundles deb,appimage

      - name: Checksums and manifest
        run: |
          mkdir -p dist/release
          cp target/release/bundle/deb/*.deb dist/release/
          cp target/release/bundle/appimage/*.AppImage dist/release/
          cd dist/release
          sha256sum ./*.deb ./*.AppImage >SHA256SUMS
          VERSION="${GITHUB_REF_NAME#v}" OUT="$PWD" python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib
          out = pathlib.Path(os.environ["OUT"])
          files = []
          for path in sorted(out.iterdir()):
              if path.suffix not in {".deb", ".AppImage"}:
                  continue
              files.append({
                  "name": path.name,
                  "bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              })
          manifest = {
              "name": "Mappa",
              "version": os.environ["VERSION"],
              "commit": os.environ["GITHUB_SHA"][:7],
              "built": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platform": "linux-amd64",
              "artifacts": files,
          }
          (out / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Sign checksums
        if: env.MAPPA_GPG_PRIVATE_KEY != ''
        env:
          MAPPA_GPG_PASSPHRASE: ${{ secrets.MAPPA_GPG_PASSPHRASE }}
        run: |
          printf '%s' "$MAPPA_GPG_PRIVATE_KEY" | gpg --batch --import
          if [ -n "${MAPPA_GPG_PASSPHRASE:-}" ]; then
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$MAPPA_GPG_PASSPHRASE" \
              --armor --detach-sign --output dist/release/SHA256SUMS.asc \
              dist/release/SHA256SUMS
          else
            gpg --batch --yes --armor --detach-sign \
              --output dist/release/SHA256SUMS.asc dist/release/SHA256SUMS
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Mappa ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            dist/release/*.deb \
            dist/release/*.AppImage \
            dist/release/SHA256SUMS \
            dist/release/manifest.json
          if [ -f dist/release/SHA256SUMS.asc ]; then
            gh release upload "$GITHUB_REF_NAME" dist/release/SHA256SUMS.asc
          fi

  windows:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Build the installer
        run: ./ui/node_modules/.bin/tauri build --bundles nsis

      - name: Publish the installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content SHA256SUMS-windows.txt
          gh release upload "$env:GITHUB_REF_NAME" $installer.FullName SHA256SUMS-windows.txt --clobber
