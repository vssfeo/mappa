name: Catalog issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: catalog-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  append:
    if: startsWith(github.event.issue.title, 'catalog:')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Append the entry
        run: node scripts/catalog-issue.mjs
      - name: Open a pull request
        env:
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          branch="catalog/issue-$ISSUE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add catalog/catalog.json
          git commit -m "catalog: add entry from #$ISSUE"
          git push origin "$branch"
          pr=$(gh pr create --title "$TITLE" --body "Catalog entry from #$ISSUE. Review bbox, licence and magnet before merging." --base main --head "$branch")
          gh issue comment "$ISSUE" --body "Открыт PR: $pr"
      - name: Explain a validation failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Не удалось добавить запись: проверьте JSON по `catalog/schema.json` и сообщение в Actions. Ничего не изменено.',
            })
