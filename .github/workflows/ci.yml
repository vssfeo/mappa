name: Linux CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri and WebKitGTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libxdo-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Unicode scan
        run: node scripts/check-unicode.mjs

      - name: UI tests
        run: npm --prefix ui test

      - name: UI lint
        run: npm --prefix ui run lint

      - name: UI build
        run: npm --prefix ui run build

      - name: Install Playwright Chromium
        run: |
          cd ui
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: UI smoke
        run: npm --prefix ui run smoke

  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri and WebKitGTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libxdo-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Build Debian package
        run: ./ui/node_modules/.bin/tauri build --bundles deb

      - name: Verify the launcher is inside the package
        run: |
          deb="$(find target/release/bundle/deb -name '*.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb -c "$deb" | grep -Eq ' \./usr/bin/mappa$'
          dpkg-deb -f "$deb" Package Version Architecture Depends
          file target/release/mappa

      - uses: actions/upload-artifact@v4
        with:
          name: mappa-deb-amd64
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error

  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri and WebKitGTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libxdo-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: arm64

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Build the app for ARM64
        run: ./ui/node_modules/.bin/tauri build --no-bundle

      - name: Smoke-test ARM64 binaries
        run: |
          file target/release/mappa | grep -Eq 'aarch64|ARM64'
          cargo build --release -p mappa-cli
          target/release/mappa-cli --help >/dev/null
          if ldd target/release/mappa | grep -q 'not found'; then
            exit 1
          fi
