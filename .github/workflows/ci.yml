name: Linux CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri and WebKitGTK dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo systemctl stop unattended-upgrades apt-daily.service apt-daily-upgrade.service || true
          sudo apt-get -o DPkg::Lock::Timeout=180 -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 update
          sudo apt-get install -y --no-install-recommends \
            -o DPkg::Lock::Timeout=300 \
            -o Dpkg::Options::=--force-confdef \
            -o Dpkg::Options::=--force-confold \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libxdo-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Unicode scan
        run: node scripts/check-unicode.mjs

      - name: UI tests
        run: npm --prefix ui test

      - name: UI lint
        run: npm --prefix ui run lint

      - name: UI build
        run: npm --prefix ui run build

      - name: Install Playwright Chromium
        run: |
          cd ui
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: UI smoke
        run: npm --prefix ui run smoke

  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: check
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri and WebKitGTK dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo systemctl stop unattended-upgrades apt-daily.service apt-daily-upgrade.service || true
          sudo apt-get -o DPkg::Lock::Timeout=180 -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 update
          sudo apt-get install -y --no-install-recommends \
            -o DPkg::Lock::Timeout=300 \
            -o Dpkg::Options::=--force-confdef \
            -o Dpkg::Options::=--force-confold \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libxdo-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Build packages
        run: ./ui/node_modules/.bin/tauri build --bundles deb,appimage

      - name: Verify the launcher is inside the package
        run: |
          deb="$(find target/release/bundle/deb -name '*.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb -c "$deb" >/tmp/mappa-deb.list
          grep -Eq '(^| )\.?/?usr/bin/mappa$' /tmp/mappa-deb.list || {
            echo "launcher /usr/bin/mappa is missing"
            cat /tmp/mappa-deb.list
            exit 1
          }
          dpkg-deb -f "$deb" Package Version Architecture Depends
          file target/release/mappa

      - name: Verify the AppImage is present
        run: |
          appimage="$(find target/release/bundle/appimage -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          test -x "$appimage"
          file "$appimage"

      - uses: actions/upload-artifact@v4
        with:
          name: mappa-deb-amd64
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: mappa-appimage-amd64
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri and WebKitGTK dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo systemctl stop unattended-upgrades apt-daily.service apt-daily-upgrade.service || true
          sudo apt-get -o DPkg::Lock::Timeout=180 -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 update
          sudo apt-get install -y --no-install-recommends \
            -o DPkg::Lock::Timeout=300 \
            -o Dpkg::Options::=--force-confdef \
            -o Dpkg::Options::=--force-confold \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libxdo-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: arm64

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Build the app for ARM64
        run: ./ui/node_modules/.bin/tauri build --no-bundle

      - name: Smoke-test ARM64 binaries
        run: |
          file target/release/mappa | grep -Eq 'aarch64|ARM64'
          cargo build --release -p mappa-cli
          target/release/mappa-cli --help >/dev/null
          if ldd target/release/mappa | grep -q 'not found'; then
            exit 1
          fi

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Build the UI
        run: npm run build --prefix ui

      - name: Check the CLI
        run: cargo check -p mappa-cli --all-targets

      - name: Test the CLI
        run: cargo test -p mappa-cli

      - name: Check the app
        run: cargo check -p mappa --lib

      - name: Build the NSIS installer
        run: ./ui/node_modules/.bin/tauri build --bundles nsis

      - name: Install and smoke-test
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $app = Get-ChildItem $env:LOCALAPPDATA -Recurse -Filter 'mappa.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw 'mappa.exe was not installed' }
          $process = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 20
          if ($process.HasExited) { throw "mappa exited with code $($process.ExitCode)" }
          $webview = Get-Process msedgewebview2 -ErrorAction SilentlyContinue
          if (-not $webview) { throw 'WebView2 process did not start' }
          $process | Stop-Process -Force

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: mappa-windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
