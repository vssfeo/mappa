name: Publish announcement discussion

on:
  push:
    paths:
      - .github/announce-trigger

permissions:
  contents: read
  discussions: write

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create discussion
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('docs/ANNOUNCEMENT.md', 'utf8');
            const result = await github.graphql(`
              mutation($repo: ID!, $cat: ID!, $title: String!, $body: String!) {
                createDiscussion(input: {
                  repositoryId: $repo,
                  categoryId: $cat,
                  title: $title,
                  body: $body
                }) {
                  discussion { url }
                }
              }
            `, {
              repo: 'R_kgDOVWmaRA',
              cat: 'DIC_kwDOVWmaRM4DJmY1',
              title: 'Mappa 1.33: offline map workstation for field, drone, SAR and Linux work',
              body
            });
            console.log(result.createDiscussion.discussion.url);
