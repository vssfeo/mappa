<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f14" />
    <meta
      name="description"
      content="Mappa — Linux-first рабочая станция для офлайн-карт и спутниковых снимков"
    />
    <title>Mappa — offline map workstation</title>
    <script>
      // Paint the shell in the saved theme before the bundle executes; without
      // it the window stays blank until React and MapLibre finish booting.
      try {
        const saved = JSON.parse(localStorage.getItem('mappa-ui') || '{}')
        if (saved.state && saved.state.theme === 'light') {
          document.documentElement.dataset.theme = 'light'
        }
      } catch {}
    </script>
    <style>
      :root {
        --boot-bg: #0b0f14;
        --boot-text: #8d9baa;
        --boot-line: #24303c;
        --boot-accent: #ff7a45;
      }
      :root[data-theme='light'] {
        --boot-bg: #f3f0e9;
        --boot-text: #5f6b77;
        --boot-line: #ddd6c8;
        --boot-accent: #bd4516;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--boot-bg);
        color: var(--boot-text);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      #boot .mark {
        font-size: 13px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
      }
      #boot .bar {
        width: 104px;
        height: 2px;
        background: var(--boot-line);
        overflow: hidden;
      }
      #boot .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: var(--boot-accent);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .bar::after {
          animation: none;
          width: 100%;
          opacity: 0.4;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-label="Mappa">
        <span class="mark">Mappa</span>
        <span class="bar"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
