[package]
name = "mappa"
version = "1.5.0"
description = "Mappa — Linux-first offline map workstation"
authors = ["Mappa contributors"]
license = "Apache-2.0"
repository = "https://github.com/vssfeo/mappa"
edition = "2024"
rust-version = "1.90"

[lib]
name = "mappa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
blake3 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
log = "0.4"
mappa-core = { path = "../crates/mappa-core" }
mappa-net = { path = "../crates/mappa-net" }
mappa-storage = { path = "../crates/mappa-storage" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "sync", "macros", "time"] }
