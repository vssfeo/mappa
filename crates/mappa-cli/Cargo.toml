[package]
name = "mappa-cli"
description = "Command-line companion for Mappa"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "mappa-cli"
path = "src/main.rs"

[features]
seed = ["dep:librqbit"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
mappa-core = { path = "../mappa-core" }
mappa-net = { path = "../mappa-net" }
mappa-storage = { path = "../mappa-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rcgen = "0.13"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
librqbit = { version = "9.1.0", optional = true }
tokio-rustls = "0.26"

[lints]
workspace = true
