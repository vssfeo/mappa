id: usgs
name: USGS Imagery
type: xyz
url: https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}
scheme: xyz
min_zoom: 0
max_zoom: 19
tile_size: 256
format: jpg
attribution: "USGS The National Map"
terms: https://www.usgs.gov/programs/national-geospatial-program/national-map
# USGS National Map data is in the public domain and may be cached offline.
offline_allowed: true
rate_limit:
  rps: 12
  burst: 24
headers:
  User-Agent: "Mappa/0.1 (https://example.invalid/mappa; contact@example.invalid)"
