id: osm-de
name: OSM Germany
type: xyz
url: https://tile.openstreetmap.de/{z}/{x}/{y}.png
scheme: xyz
min_zoom: 0
max_zoom: 19
tile_size: 256
format: png
attribution: "© OpenStreetMap contributors"
terms: https://www.openstreetmap.org/copyright
# A volunteer-run mirror. Interactive viewing only, like the main OSM server.
offline_allowed: false
rate_limit:
  rps: 4
  burst: 8
headers:
  User-Agent: "Mappa/0.1 (interactive offline map workstation)"
